name: tracebug-local

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracebug_local
      POSTGRES_USER: tracebug
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${PGPORT:-5433}:5432"
    volumes:
      - tracebug_local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracebug -d tracebug_local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tracebug_local_db:
