services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracebug
      POSTGRES_USER: tracebug
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - tracebug_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracebug -d tracebug"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: tracebug:2.0.0
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: tracebug
      PGUSER: tracebug
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_ORIGIN: ${COMPOSE_PUBLIC_ORIGIN:-http://localhost:3001}
      COOKIE_SECURE: ${COMPOSE_COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      COMPANY_EMAIL_DOMAIN: ${COMPANY_EMAIL_DOMAIN:-kando.com.cn}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${APP_PORT:-3001}:3001"
      - "${HTTP_PORT:-80}:3001"
    volumes:
      - tracebug_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  tracebug_db:
  tracebug_uploads:
